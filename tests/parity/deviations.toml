# ---------------------------------------------------------------------------
# gffutils compatibility deviations register
# ---------------------------------------------------------------------------
#
# Every difference between gffbase's public surface and the frozen gffutils
# oracle (commit 6b84330, "0.14") must be declared here. `test_api_parity.py`
# fails on:
#
#   * an UNDECLARED gap  -- gffbase is missing something the oracle exports and
#     nothing here says why;
#   * a STALE declaration -- something is declared missing or deviating but is
#     in fact present and matching, so the register has rotted.
#
# The second rule is what keeps this file honest: entries cannot be left behind
# after the work lands. Delete a `planned` entry in the same commit that
# implements it.
#
# status values
# -------------
#   planned      Not implemented yet. Must name the phase that delivers it.
#                Reported as an expected gap; the suite stays green.
#   intentional  Deliberately different from the oracle, permanently. Must give
#                a reason and name the regression test that pins the behaviour.
#   excluded     Genuinely out of scope (upstream implementation detail with no
#                downstream contract). Must say why it is not a contract.
#
# ---------------------------------------------------------------------------

# ===========================================================================
# PLANNED -- compatibility modules not yet ported.
# ===========================================================================

[[deviation]]
kind = "module"
name = "gffbase.attributes"
status = "planned"
phase = "missing-surface"
note = """The `Attributes` MutableMapping and the swappable `dict_class` alias.
gffbase currently has an equivalent in `feature._LazyAttributes`, but it is
private and its `always_return_list` behaviour is not wired to a module-level
toggle the way the oracle's is."""

[[deviation]]
kind = "module"
name = "gffbase.bins"
status = "planned"
phase = "missing-surface"
note = """UCSC binning. `gffbase._bins` exists but is private AND computes
different bins than the oracle: its offsets are (585, 73, 9, 1, 0) against the
oracle's [4681, 585, 73, 9, 1], so `bins(1, 100)` returns 585 where the oracle
returns 4681. Because `export_sqlite` writes this into the legacy `bin` column
and the oracle's `region()` uses bins to narrow its query, a legacy consumer
reading a gffbase export gets wrong results. The public module and the
corrected offsets land together."""

[[deviation]]
kind = "module"
name = "gffbase.constants"
status = "planned"
phase = "missing-surface"
note = """Schema/dialect constants plus the two documented global toggles,
`always_return_list` and `ignore_url_escape_characters`. Both are read at
runtime by the oracle's attribute machinery and are part of its documented
API."""

