# ---------------------------------------------------------------------------
# gffutils compatibility deviations register
# ---------------------------------------------------------------------------
#
# Every difference between gffbase's public surface and the frozen gffutils
# oracle (commit 6b84330, "0.14") must be declared here. `test_api_parity.py`
# fails on:
#
#   * an UNDECLARED gap  -- gffbase is missing something the oracle exports and
#     nothing here says why;
#   * a STALE declaration -- something is declared missing or deviating but is
#     in fact present and matching, so the register has rotted.
#
# The second rule is what keeps this file honest: entries cannot be left behind
# after the work lands. Delete a `planned` entry in the same commit that
# implements it.
#
# status values
# -------------
#   planned      Not implemented yet. Must name the phase that delivers it.
#                Reported as an expected gap; the suite stays green.
#   intentional  Deliberately different from the oracle, permanently. Must give
#                a reason and name the regression test that pins the behaviour.
#   excluded     Genuinely out of scope (upstream implementation detail with no
#                downstream contract). Must say why it is not a contract.
#
# ---------------------------------------------------------------------------

# ===========================================================================
# EVERY `planned` ENTRY HAS LANDED.
# ===========================================================================
#
# The ten compatibility modules and all 38 planned symbols are implemented, so
# their declarations are gone rather than marked done -- an entry that outlives
# the work it describes is itself a failure, and `test_api_parity.py` enforces
# that. What remains below is the permanent register: places where gffbase
# deliberately behaves differently, and upstream details that are not contracts.

# ===========================================================================
# INTENTIONAL -- deliberately different, permanently.
# ===========================================================================

[[deviation]]
kind = "symbol"
name = "gffbase.helpers.annotate_gff_db"
status = "intentional"
reason = """Raises `NotImplementedError` where the oracle's body is a bare
`pass`. Upstream lists it as public API and it silently returns None, so a
caller believes their database was annotated. Saying so is strictly better
than pretending; the name exists so imports resolve. Pinned by
`test_annotate_gff_db_refuses_rather_than_pretending`."""

[[deviation]]
kind = "symbol"
name = "gffbase.helpers.get_gff_db"
status = "intentional"
reason = """Always returns a `FeatureDB`. The oracle returns a *path string*
when a sibling `.db` exists and a `FeatureDB` otherwise, which is why
`gffutils-cli fetch` raises `TypeError: string indices must be integers` in
its common case -- it indexes whatever it got. Its sibling filename is also
built with `"%s.%s" % (name, ".db")`, producing `foo.gff..db`. Pinned by
`test_get_gff_db_always_returns_a_database`."""

[[deviation]]
kind = "symbol"
name = "gffbase.helpers.canonical_transcripts"
status = "intentional"
reason = """Two upstream defects are not reproduced. Its no-CDS fallback sorts
ascending and takes `[0]`, selecting the SHORTEST transcript against its own
comment; and it `print()`s an internal tuple to stdout for every gene, which
corrupts any piped output. Pinned by
`test_canonical_transcripts_picks_the_longest_and_prints_nothing`."""

[[deviation]]
kind = "symbol"
name = "gffbase.helpers.dialect_compare"
status = "intentional"
reason = """Compares key by key rather than through `set(dict.items())`. The
oracle's form raises `TypeError: unhashable type: 'list'` on any dialect
carrying an `order` list -- which is all of them -- so it works only on
hand-built dialects. Pinned by `test_dialect_compare_handles_real_dialects`."""

[[deviation]]
kind = "symbol"
name = "gffbase.helpers.to_unicode"
status = "intentional"
reason = """Actually decodes bytes. After `2to3`, the oracle's body is
`if isinstance(obj, str): if not isinstance(obj, str): ...` -- an unreachable
inner branch making it the identity for every input, bytes included. Pinned by
`test_to_unicode_decodes_bytes`."""

[[deviation]]
kind = "symbol"
name = "gffbase.helpers.make_query"
status = "intentional"
reason = """Validates `order_by` against the whitelist for a plain string as
well as for an iterable. The oracle checks only the iterable form and
interpolates a bare string verbatim -- the same defect class as the `order_by`
and `set_pragmas` injections fixed in this release (see
docs/source/content/advisory_sql_injection.rst). Pinned by
`test_make_query_validates_a_string_order_by`."""

[[deviation]]
kind = "symbol"
name = "gffbase.interface.FeatureDB.update"
status = "intentional"
reason = """Same ids, relations and GTF inference as the oracle, with four
differences. (1) An inferred GTF transcript or gene grows to enclose children
the update gives it; the oracle keeps the old extent, so the parent stops
covering its own child and `region()` over the new exon misses its gene.
(2) `merge_strategy="replace"` drops the replaced row's old `Parent` edges
before deriving the new ones; the oracle leaves the stale relation.
(3) An unknown keyword raises `TypeError`; the oracle's creator swallows it.
(4) `make_backup` writes no `.bak`. Pinned by
`test_gtf_exons_join_existing_and_inferred_transcripts`,
`test_merge_strategy_replace_swaps_the_row_and_its_parent_edge`,
`test_an_unknown_keyword_is_refused` and `test_update_matches_gffutils`."""

[[deviation]]
kind = "symbol"
name = "gffbase.interface.FeatureDB.iter_by_parent_childs"
status = "intentional"
reason = """Honours `level`. The oracle accepts the argument and never passes it to
`children()`, so `level=1` returns every descendant. Pinned by
`test_iter_by_parent_childs_honours_level`."""

[[deviation]]
kind = "symbol"
name = "gffbase.interface.FeatureDB.create_splice_sites"
status = "intentional"
reason = """Works on files where the oracle raises KeyError (intro_docs_example.gff,
FBgn0031208.gtf, gencode-v19.gtf), and emits 2 bp dinucleotide sites typed
by transcript position. Pinned by
`test_create_splice_sites_works_where_the_oracle_raises`."""

[[deviation]]
kind = "symbol"
name = "gffbase.iterators._FileIterator.open_function"
status = "excluded"
reason = """The oracle's internal file opener for its own line reader. gffbase reads
through its parser (gzip by content in both engines), so there is no opener to
expose; `peek`, the method callers actually use, is implemented."""

[[deviation]]
kind = "symbol"
name = "gffbase.iterators._UrlIterator.open_function"
status = "excluded"
reason = """As `_FileIterator.open_function`: the URL iterator downloads to a
temporary file and reads it through the parser."""

[[deviation]]
kind = "symbol"
name = "gffbase.interface.FeatureDB.all_features"
status = "intentional"
reason = """`order_by="score"` sorts numerically; the oracle sorts it as text.
GFF column 6 is stored as text because the spec allows `.` there, so an ORDER
BY on it ranks `10 < 100 < 1e3 < 2.5 < 9` -- "the highest-scoring features"
comes back wrong with nothing raised. gffbase applies
`TRY_CAST(score AS DOUBLE)`, so `.` and any non-numeric value become NULL and
sort last. Also: every ordered query appends `id ASC`, because no sort column
is unique and DuckDB does not preserve ties across a parallel sort, and
`reverse` applies to every key rather than only the last. Pinned by
`test_score_sorts_numerically_not_lexicographically`,
`test_an_unscored_feature_sorts_last` and
`test_every_order_clause_ends_in_a_unique_column`."""

[[deviation]]
kind = "symbol"
name = "gffbase.attributes.Attributes"
status = "intentional"
reason = """`Attributes.items()` and `.values()` keep returning lists when
`constants.always_return_list` is False; only `__getitem__` honours the
toggle. Upstream routes all three through it, which makes `items()` yield
strings, and every consumer that iterates a value then walks it one character
at a time -- gffutils' own `_reconstruct` renders `gene1` as `g,e,n,e,1` that
way. gffbase's write paths all iterate `.items()`, so reproducing it would
corrupt stored data rather than merely differ. Pinned by
`test_always_return_list_applies_to_getitem_only`."""

[[deviation]]
kind = "symbol"
name = "gffbase.create._DBCreator"
status = "intentional"
reason = """`_DBCreator` / `_GFFDBCreator` / `_GTFDBCreator` are adapters over
`create_db`, not ports. gffbase ingests through a Rust parser feeding Arrow
batches into DuckDB and has no per-row Python seam, so a subclass that
overrides a row-level hook cannot work here and there is nothing to
reimplement that would make it work. `create_db(transform=...)` is the
supported per-feature intervention. Pinned by
`test_db_creators_build_a_working_database`."""

[[deviation]]
kind = "signature"
name = "gffbase.create_db.create_db"
status = "intentional"
reason = """`pragmas` defaults to None rather than `constants.default_pragmas`.
Every pragma in that dict is SQLite-only and none exists in DuckDB, so
defaulting to it would mean every `create_db` call began by discarding four
settings. Passing it explicitly still works and still skips them. gffbase also
adds `mode` and `on_multipart_conflict`, which the oracle has no equivalent
for.

Behaviour: with a non-default `gtf_gene_key` / `gtf_transcript_key` and the
default `id_spec`, an inferred parent takes the id the spec names (its
`gene_id` / `transcript_id`, carried over from its children) and stays linked
to them. The oracle gives it an autoincremented id and records its relations
against the grouping value, so the inferred parent ends up disconnected. With
an `id_spec` that names the same keys the two agree. `text_factory` warns when
set, since it only configures sqlite3. Pinned by
`test_gtf_gene_key_groups_transcripts_into_genes` and
`test_matches_gffutils_when_the_id_spec_names_the_keys`.

Under non-default options (tests/parity/test_options_differential.py, where
each is an xfail with its reason): `force_dialect_check=True` loads where the
oracle raises TypeError on every file; a transform over rows without
coordinates loads where the oracle's `if feature:` crashes in `__len__`; with
`disable_infer_transcripts=True` and no authored transcripts, a child is not
linked to its gene (the oracle records a level-2 relation from `gene_id`;
gffbase stores direct relations only); an id_spec callable that names an
inferred transcript after its own exon keeps the transcript under a generated
id instead of merging it away.

Noisy GTF (tests/test_noisy_input.py): a CDS-only file -- no exon rows at all,
as gene predictors write -- gets transcripts and genes inferred from its CDS
rows (the oracle infers from exons only, so none); a row with `gene_id` but no
`transcript_id` hangs directly from its gene (the oracle: level 2); an
AUGUSTUS gene/transcript row whose column 9 is one bare token is read as that
row's `gene_id`/`transcript_id` (the oracle: a key with no value); an
authored transcript with no `gene_id` takes the gene its children name.

Noisy lines (tests/test_noisy_input.py): a UTF-8 byte-order mark is not part
of the first seqid (the oracle: `\ufeffchr1`); a whitespace-only line is blank
(the oracle: a feature with seqid `   ` and id `._1`); `.` in column 9 means no
attributes (the oracle: a key named `.`, written back as `. ""`); in compat
mode, spaces around a spaced `=` are not part of the key or value (the oracle:
key `ID `, value ` g1`, so the id is lost). Identifiers: when `create_unique`
or `merge` renames a duplicate, and when an id is generated, gffbase skips
names the file already uses literally (Liftoff writes `X_1` for extra copies);
the oracle raises IntegrityError / "Duplicate ID" instead."""

[[deviation]]
kind = "symbol"
name = "gffbase.feature.Feature.attributes"
status = "intentional"
reason = """Where a multi-value attribute ends. GFF3 says an unescaped comma
separates values and a literal comma must be percent-encoded, so gffbase splits
on every unescaped comma. The oracle does not: `gffutils/parser.py` keeps a
comma FOLLOWED BY A SPACE inside the value, so that an unescaped
`description=kinase, subunit 1` survives as one value rather than two nonsense
ones.

So `gene_name=ADAM6, RPS8P1` reads as `["ADAM6", " RPS8P1"]` here and as
`["ADAM6, RPS8P1"]` upstream. Neither reading is careless and the corpus
decides which one hurts: ten CHESS genes really do record two names that way,
while RefSeq writes prose descriptions with unescaped commas. gffbase follows
the specification, which is also the reading that can be corrected by escaping.

No fixture in the shared corpus contains a comma-space attribute -- every
occurrence in `FBgn0031208.gff` is inside a comment -- so nothing detected this
until a whole-genome benchmark reported CHESS as a 20-row content divergence
between the engines. Pinned by
`test_a_comma_followed_by_a_space_splits_for_us_and_not_for_the_oracle`."""

[[deviation]]
kind = "symbol"
name = "gffbase.interface.FeatureDB.__contains__"
status = "intentional"
reason = """`"missing_id" in db` returns False; the oracle RAISES
`FeatureNotFoundError`. Not a choice upstream made -- `gffutils.FeatureDB`
defines neither `__contains__` nor `__iter__`, so Python falls back to
iterating via `__getitem__`, which raises on the first missing key. The `in`
operator therefore fails on precisely the question it exists to answer, and
`if x in db:` cannot be written against it without a try/except.

Python's data model is explicit that `__contains__` returns a bool. Pinned by
`test_featuredb_contains_returns_false_for_a_missing_id`."""

[[deviation]]
kind = "symbol"
name = "gffbase.interface.FeatureDB.bed12"
status = "intentional"
reason = """`thickStart`/`thickEnd` can differ on a file where the oracle loses
a `Parent` edge to its unstripped-attribute-key defect: with no CDS children
visible it marks the whole feature thick, where gffbase finds the CDS and
computes a real thick span. Measured on `FBgn0031208.gff`. This is the
attribute-key deviation showing through, not a bed12 difference. Pinned by
`test_bed12_matches_the_oracle`.

The span validation is NOT a deviation: gffbase now raises the oracle's exact
message when the blocks do not reach the feature's bounds, because BED12
cannot represent that and the oracle is right to refuse. Pinned by
`test_bed12_refuses_blocks_that_do_not_span_the_feature`."""

