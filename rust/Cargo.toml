[package]
name = "gffbase-core"
version = "0.1.1"
edition = "2021"
# Minimum supported rustc. This is the toolchain the `lint` CI job compiles
# the whole crate with (`cargo clippy --locked --all-targets`), so the claim is
# enforced rather than asserted.
#
# It was previously "1.69", justified by a `Cargo.lock` that was in fact
# gitignored and absent. With the lock now committed, the resolved graph
# includes flate2 1.1.x, which does not build on 1.69. Rather than leave an
# unverifiable floor in place, this declares the version we actually test.
rust-version = "1.83"
description = "Rust core for GFFBase: high-performance GFF3/GTF parser exposed to Python via PyO3."
readme = "../README.md"
license = "Apache-2.0"
authors = ["Kuan-Hao Chao <kuanhao.chao@gmail.com>"]
repository = "https://github.com/Kuanhao-Chao/gffbase"
homepage = "https://github.com/Kuanhao-Chao/gffbase"
keywords = ["gff", "gtf", "bioinformatics", "parser", "pyo3"]
categories = ["science", "parser-implementations", "api-bindings"]

[lib]
# The compiled artifact must match the Python submodule name: gffbase._native
name = "_native"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
pyo3   = { version = "0.22", features = ["extension-module", "abi3-py39"] }
memchr = "2.7"
memmap2 = "0.9"
flate2 = "1.0"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
