name: Deploy documentation

on:
  push:
    branches: [main]
    # Skip the build for pushes that can't possibly affect the rendered
    # site (e.g. test-only commits). Saves Actions minutes without
    # breaking auto-sync of anything user-visible.
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'benchmarks/results/**'
      - 'tools/gen_benchmark_tables.py'
      - 'MIGRATION.md'
      - 'python/gffbase/**'           # autodoc reads docstrings here
      - 'pyproject.toml'              # docs extras live here
      - '.github/workflows/docs.yml'  # self-trigger on workflow edits
  workflow_dispatch: {}

# Never race two doc deploys against gh-pages.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

# Nothing at the workflow level. A workflow-level grant reaches every job,
# including any added later; the write is needed by exactly one job and is
# declared there.
permissions: {}

jobs:
  deploy:
    name: Build & publish the Sphinx site
    runs-on: ubuntu-latest
    permissions:
      # The built HTML is force-pushed to the gh-pages branch, which GitHub
      # Pages serves at https://khchao.com/gffbase/ as a project page under
      # the user site. That push is the only write this workflow performs.
      contents: write # force-push the built site to gh-pages; nothing else writes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gh-deploy compares against the gh-pages branch's history;
          # a shallow clone breaks that comparison.
          fetch-depth: 0
          # The publish step below pushes with an explicit token URL into a
          # freshly `git init`-ed tree, so it never reads the checkout's
          # stored credentials. Leaving them in `.git/config` would only make
          # the token readable to every later step in the job.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Sphinx 9 requires >= 3.12. Pinned rather than floating so a runner
          # image update cannot change the toolchain under the site.
          python-version: "3.12"
          cache: pip

      # autodoc imports the gffbase package to read docstrings; the package has
      # a Rust extension, so cargo must be available at `pip install -e .` time.
      # Without it the install falls back to _pyfallback, and the native module
      # is the production path and the one we want documented.
      # The SHA is on the action's `stable` branch, whose action.yml defaults
      # the `toolchain` input to `stable`; stated explicitly so the intent
      # survives a re-pin. See the note in ci.yml -- the per-version branches
      # carry different action.yml files and are not interchangeable.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install gffbase + docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build the site
        # -W --keep-going: every warning is an error, and all of them are
        # reported in one pass rather than one per run. A broken cross-reference
        # or a page missing from the toctree fails here, not silently on the
        # published site.
        run: make -C docs html SPHINXOPTS="-W --keep-going"

      # Published with plain git rather than a third-party publishing action:
      # it is a dozen lines, it adds no supply-chain surface to a job that
      # holds `contents: write`, and it is auditable in place.
      - name: Publish to gh-pages
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # Through the environment, not `${{ }}` inside `run:`. An expression
          # is substituted into the script *before* the shell sees it, so the
          # token would land in the generated script on disk.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `.nojekyll` is load-bearing: without it Pages runs the output
          # through Jekyll, which strips every directory beginning with an
          # underscore -- including Sphinx's `_static`, so the site would load
          # with no CSS at all.
          touch docs/build/html/.nojekyll
          cd docs/build/html
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "Deploy docs from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
