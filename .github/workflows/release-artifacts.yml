name: Build and verify release artifacts

on:
  workflow_call:
    inputs:
      expected_version:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"

jobs:
  build-linux:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            rust-target: x86_64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            rust-target: aarch64
    env:
      EXPECTED_TARGET: ${{ matrix.target }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Build the only Linux wheel for this target
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.rust-target }}
          manylinux: auto
          args: --release --locked --out dist --manifest-path rust/Cargo.toml
          rust-toolchain: 1.83.0
      - name: Inspect before immutable upload
        run: |
          python -m pip install 'packaging==25.0'
          python tools/release_artifacts.py inspect \
            --artifact-dir dist \
            --expected-version "$EXPECTED_VERSION" \
            --expected-target "$EXPECTED_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
          - target: macos-arm64
            runner: macos-15
            rust-target: aarch64-apple-darwin
    env:
      EXPECTED_TARGET: ${{ matrix.target }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Build the only macOS wheel for this target
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.rust-target }}
          args: --release --locked --out dist --manifest-path rust/Cargo.toml
          rust-toolchain: 1.83.0
      - name: Inspect before immutable upload
        run: |
          python -m pip install 'packaging==25.0'
          python tools/release_artifacts.py inspect \
            --artifact-dir dist \
            --expected-version "$EXPECTED_VERSION" \
            --expected-target "$EXPECTED_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build windows-x86_64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      EXPECTED_TARGET: windows-x86_64
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Build the only Windows wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --locked --out dist --manifest-path rust/Cargo.toml
          rust-toolchain: 1.83.0
      - name: Inspect before immutable upload
        shell: bash
        run: |
          python -m pip install 'packaging==25.0'
          python tools/release_artifacts.py inspect \
            --artifact-dir dist \
            --expected-version "$EXPECTED_VERSION" \
            --expected-target "$EXPECTED_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-windows-x86_64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Build the only source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          # No `--locked`: `maturin sdist` compiles nothing and rejects it. The
          # lock file ships inside the sdist and binds its builds.
          args: --out dist --manifest-path rust/Cargo.toml
          rust-toolchain: 1.83.0
      - name: Inspect before immutable upload
        run: |
          python -m pip install 'packaging==25.0'
          python tools/release_artifacts.py inspect \
            --artifact-dir dist \
            --expected-version "$EXPECTED_VERSION" \
            --expected-target sdist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  wheel-smoke:
    name: Install ${{ matrix.target }} on Python ${{ matrix.python-version }}
    needs: [build-linux, build-macos, build-windows]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          [linux-aarch64, linux-x86_64, macos-arm64, macos-x86_64, windows-x86_64]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: windows-x86_64
            runner: windows-latest
    env:
      EXPECTED_TARGET: ${{ matrix.target }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python-version }}" }
      # `WHEEL_DIR` was a job-level `env:` reading `${{ runner.temp }}`, a
      # context that does not exist at job level: GitHub substituted the empty
      # string, so the download below landed in `$RUNNER_TEMP/release-wheel`
      # while every consumer looked in `/release-wheel`. Defined once here and
      # used by both, so the two cannot drift apart again.
      - name: Resolve the wheel directory
        shell: bash
        run: echo "WHEEL_DIR=${RUNNER_TEMP}/release-wheel" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package-${{ matrix.target }}
          path: ${{ env.WHEEL_DIR }}
      - name: Reinspect and install the exact wheel
        shell: bash
        run: |
          # tools/release_artifacts.py needs a TOML reader; tomllib is 3.11+.
          python -m pip install --upgrade pip 'packaging==25.0' 'tomli>=2; python_version < "3.11"'
          python tools/release_artifacts.py inspect \
            --artifact-dir "$WHEEL_DIR" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-target "$EXPECTED_TARGET"
          wheel=$(find "$WHEEL_DIR" -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          # A fresh venv, as sdist-smoke does: `pip check` in the runner's own
          # interpreter also checks what the image preinstalls (pipx on the
          # Windows 3.12 image requires packaging>=26 and failed the job).
          python -m venv "$RUNNER_TEMP/wheel-install"
          venv_bin="$RUNNER_TEMP/wheel-install/bin"
          [ -d "$venv_bin" ] || venv_bin="$RUNNER_TEMP/wheel-install/Scripts"
          "$venv_bin/python" -m pip install --upgrade pip
          "$venv_bin/python" -m pip install --force-reinstall "$wheel"
          "$venv_bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$venv_bin/python" - <<'PY'
          import importlib.metadata
          import gffbase
          import gffbase._native as native

          assert importlib.metadata.version("gffbase") == gffbase.__version__ == native.__version__
          assert gffbase.native_available()
          db = gffbase.create_db(
              "##gff-version 3\nchr1\tsmoke\tgene\t1\t10\t.\t+\t.\tID=g\n",
              ":memory:",
              from_string=True,
          )
          assert gffbase.validate_db(db, level="full").ok
          db.close()
          PY
          PATH="$venv_bin:$PATH" gffbase --version

  sdist-smoke:
    name: Clean-build and install the exact sdist
    needs: build-sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@c18ebc01c713fe144ce50311473bf5c1b15b8e08 # 1.83
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # See the wheel-smoke job above: `runner.temp` is unavailable in a
      # job-level `env:` and silently becomes empty.
      - name: Resolve the sdist directory
        run: echo "SDIST_DIR=${RUNNER_TEMP}/release-sdist" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package-sdist
          path: ${{ env.SDIST_DIR }}
      - name: Reinspect, build, and install outside the checkout
        run: |
          python -m pip install --upgrade pip 'packaging==25.0'
          python tools/release_artifacts.py inspect \
            --artifact-dir "$SDIST_DIR" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-target sdist
          sdist=$(find "$SDIST_DIR" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$sdist"
          python -m venv "${RUNNER_TEMP}/sdist-install"
          "${RUNNER_TEMP}/sdist-install/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/sdist-install/bin/python" -m pip install "$sdist"
          "${RUNNER_TEMP}/sdist-install/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "${RUNNER_TEMP}/sdist-install/bin/python" - <<'PY'
          import importlib.metadata
          import gffbase
          import gffbase._native as native

          assert importlib.metadata.version("gffbase") == gffbase.__version__ == native.__version__
          assert gffbase.native_available()
          db = gffbase.create_db(
              "##gff-version 3\nchr1\tsmoke\tgene\t1\t10\t.\t+\t.\tID=g\n",
              ":memory:",
              from_string=True,
          )
          assert gffbase.validate_db(db, level="full").ok
          db.close()
          PY

  validate-artifacts:
    name: Bind the complete verified artifact set
    needs:
      [build-linux, build-macos, build-windows, build-sdist, wheel-smoke, sdist-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
      RELEASE_RUN_ID: ${{ github.run_id }}
      RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # As above: both of these were job-level `env:` entries reading
      # `runner.temp`, which is empty there. `create-manifest` was pointed at
      # `/release-packages` while the download wrote to `$RUNNER_TEMP`.
      - name: Resolve the package and manifest directories
        run: |
          echo "PACKAGE_DIR=${RUNNER_TEMP}/release-packages" >> "$GITHUB_ENV"
          echo "MANIFEST_DIR=${RUNNER_TEMP}/release-verification" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-package-*
          path: ${{ env.PACKAGE_DIR }}
          merge-multiple: true
      - name: Strictly inspect and bind every package byte
        run: |
          python -m pip install 'packaging==25.0'
          mkdir -p "$MANIFEST_DIR"
          python tools/release_artifacts.py create-manifest \
            --artifact-dir "$PACKAGE_DIR" \
            --manifest "$MANIFEST_DIR/release-artifact-manifest.json" \
            --expected-version "$EXPECTED_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --repository "$RELEASE_REPOSITORY" \
            --workflow-ref "$RELEASE_WORKFLOW_REF" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification
          path: ${{ runner.temp }}/release-verification/release-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14
