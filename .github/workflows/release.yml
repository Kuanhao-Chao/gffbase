name: Release wheels & PyPI publish

# Thin publisher. This file decides WHETHER to publish and then publishes; it
# builds nothing itself.
#
# Every artifact comes from the reusable `release-artifacts.yml`, which is the
# single place a wheel or sdist is produced for either channel. When this file
# had its own copy of the build matrix, PyPI and TestPyPI could ship
# differently-built artifacts from the same commit and nothing would notice --
# the dress rehearsal stopped rehearsing the thing it was meant to.
#
# Order is load-bearing: policy, then qualification, then artifacts, then
# publish. Policy runs FIRST and fail-closed, so a run that is not allowed to
# publish is rejected before it has spent an hour building wheels, and a
# dispatched run without the explicit opt-in below can only ever be build-only.

on:
  push:
    # Stable release tags only. Release-candidate tags (v*rc*) route to
    # testpypi-release.yml for the dress rehearsal -- without this exclusion an
    # RC tag would fire BOTH workflows and publish unvalidated wheels to
    # production PyPI.
    tags:
      - 'v*'
      - '!v*rc*'
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish to PyPI. Leave false for a build-only dry run. A manual run
          still has to satisfy every tag and metadata check in
          tools/release_policy.py; this only says the operator meant it.
        type: boolean
        default: false
        required: true

# Never race two release tags against each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------
  # 1. Policy. Fail-closed: decides the version and whether publishing is
  #    permitted, and rejects the wrong tag class for this channel before any
  #    build minute is spent.
  # ------------------------------------------------------------------------
  policy:
    name: Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # The policy helper imports `packaging`, and this is a bare runner, not
      # the dev environment. Without this step the policy died with
      # ModuleNotFoundError on every run and nothing could publish.
      # tests/test_release_workflows.py derives the list from the script.
      - name: Install the policy helper's dependency
        run: python -m pip install 'packaging==25.0'
      - name: Evaluate release policy
        id: decide
        # Through `env:`, not `${{ }}` inside `run:`. An expression is
        # substituted into the script text before the shell parses it, so a
        # ref name is free to close the quote and append commands. `ref_name`
        # comes from the tag or branch a fork can create; the shell only ever
        # sees these as variables.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_REQUESTED: ${{ inputs.publish || 'false' }}
        run: |
          python tools/release_policy.py \
            --channel production \
            --event-name "$EVENT_NAME" \
            --ref-type "$REF_TYPE" \
            --ref-name "$REF_NAME" \
            --publish-requested "$PUBLISH_REQUESTED" \
            --github-output "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------------
  # 2. Qualification. Every named release gate, on the tagged commit.
  # ------------------------------------------------------------------------
  qualification:
    name: Complete release qualification
    needs: policy
    uses: ./.github/workflows/qualification.yml

  # ------------------------------------------------------------------------
  # 3. Artifacts. The only place wheels and the sdist are built.
  # ------------------------------------------------------------------------
  artifacts:
    name: Build and verify release artifacts
    # BOTH: `needs.<job>` resolves only for direct dependencies, and this
    # job reads `needs.policy.outputs.version` below. Declaring only
    # `qualification` made that an empty string, which every
    # `release_artifacts.py inspect` then rejected.
    needs: [policy, qualification]
    uses: ./.github/workflows/release-artifacts.yml
    with:
      expected_version: ${{ needs.policy.outputs.version }}
      source_sha: ${{ github.sha }}

  # ------------------------------------------------------------------------
  # 4. Publish, via OIDC. No API token is stored in repo secrets.
  #
  # PyPI trusted-publisher setup (one-time, on PyPI's web UI):
  #   Project -> Publishing -> Add a new publisher
  #     Owner: Kuanhao-Chao   Repository: gffbase
  #     Workflow: release.yml  Environment: pypi
  # ------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    # Same reason: without `policy` here the condition compared '' to
    # 'true' and this job was SKIPPED on every run, tag pushes included.
    needs: [policy, artifacts]
    if: needs.policy.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/gffbase
    permissions:
      id-token: write   # OIDC claim -> PyPI Trusted Publisher
      contents: write   # attach the same binaries to the GitHub Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # `release-artifacts.yml` uploads the packages as
          # `release-package-*` and the manifest as `release-verification`.
          # Without this pattern the manifest JSON lands in dist/ and is
          # handed to twine as if it were a distribution.
          pattern: release-package-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          verbose: true
      # Mirror the same artifacts onto the GitHub Release. `draft: true` keeps
      # it a draft after upload so a maintainer eyeballs the attached binaries
      # before clicking Publish.
      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          draft: true
