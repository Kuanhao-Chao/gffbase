name: TestPyPI release (release-candidate dress rehearsal)

# Mirrors the production release.yml job topology exactly so a green
# run here proves the same build + OIDC publish mechanism will work
# unchanged when we tag the stable release. Diffs from production:
#   - Trigger only on canonical v*rc* tags (release.yml excludes them).
#   - Different concurrency group + GitHub environment.
#   - publish step adds repository-url to redirect uploads to TestPyPI.

on:
  push:
    tags:
      # Release-candidate tags only — stable tags route to release.yml.
      - 'v*rc*'
  workflow_dispatch: {}

# Never race two RC publishes against the same TestPyPI version.
concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  qualification:
    name: Complete release qualification
    uses: ./.github/workflows/qualification.yml

  # Qualification above covers behavior. This job additionally proves the
  # exact artifact under review is a canonical RC with four matching version
  # identities before any wheel job or TestPyPI upload can start.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    needs: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: TestPyPI tag policy
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          pip install 'packaging>=24'
          python - <<'PY'
          import os
          from packaging.version import InvalidVersion
          import packaging.version

          ref = os.environ["RELEASE_REF"]
          if not ref.startswith("v"):
              raise SystemExit("TestPyPI publication requires an RC version tag, including workflow_dispatch")
          try:
              candidate = packaging.version.Version(ref[1:])
          except InvalidVersion as exc:
              raise SystemExit(f"invalid release tag {ref!r}: {exc}") from exc
          if ref != f"v{candidate}":
              raise SystemExit(f"release tag {ref!r} is not canonical PEP 440 (expected v{candidate})")
          if not candidate.is_prerelease or candidate.pre is None or candidate.pre[0] != "rc":
              raise SystemExit("TestPyPI publication requires a PEP 440 release candidate")
          PY
      - name: Build and install the exact wheel under review
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/gffbase-release-identity
          /tmp/gffbase-release-identity/bin/pip install --force-reinstall 'packaging>=24' dist/*.whl
      - name: Built metadata, Python, native, and tag identities agree
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          /tmp/gffbase-release-identity/bin/python - <<'PY'
          import importlib.metadata
          import os
          import gffbase
          import gffbase._native as native
          from packaging.version import Version

          expected = os.environ["RELEASE_REF"][1:]
          installed = importlib.metadata.version("gffbase")
          assert str(Version(installed)) == expected
          assert installed == gffbase.__version__ == native.__version__ == expected
          PY

  # ------------------------------------------------------------------------
  # Linux wheels — manylinux via maturin-action's Docker image.
  # abi3-py310 means a single wheel per arch covers CPython 3.10-3.14.
  # ------------------------------------------------------------------------
  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --manifest-path rust/Cargo.toml
          rust-toolchain: stable
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  # ------------------------------------------------------------------------
  # macOS wheels — both Intel and Apple Silicon. GitHub deprecated the
  # macos-13 (Intel) runner image, so x86_64 wheels are cross-compiled
  # from the Apple Silicon runner via maturin-action's rustup target.
  # ------------------------------------------------------------------------
  macos:
    name: macOS ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path rust/Cargo.toml
          rust-toolchain: stable
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  # ------------------------------------------------------------------------
  # Windows wheel — single arch (x86_64) for now.
  # ------------------------------------------------------------------------
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --out dist --manifest-path rust/Cargo.toml
          rust-toolchain: stable
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist/*.whl

  # ------------------------------------------------------------------------
  # Source distribution — for archs we don't ship a wheel for.
  # ------------------------------------------------------------------------
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path rust/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ------------------------------------------------------------------------
  # Publish — gathers all artifacts and uploads to TestPyPI via OIDC.
  #
  # TestPyPI trusted-publisher setup (one-time, on test.pypi.org's web UI):
  #   Account → Publishing → Add a new pending publisher
  #     PyPI Project Name:  gffbase
  #     Owner:              Kuanhao-Chao
  #     Repository name:    gffbase
  #     Workflow name:      testpypi-release.yml
  #     Environment name:   testpypi
  # No API token is stored in repo secrets.
  # ------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gffbase
    permissions:
      id-token: write   # OIDC claim → TestPyPI Trusted Publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          verbose: true
