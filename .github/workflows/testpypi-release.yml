name: TestPyPI release (release-candidate dress rehearsal)

# Thin publisher for release candidates. Identical in shape to release.yml and
# deliberately so: it calls the SAME reusable `release-artifacts.yml`, so the
# artifacts rehearsed here are built exactly the way the production ones will
# be. When each publisher carried its own build matrix, the dress rehearsal
# could pass while production shipped something built differently.
#
# Differences from release.yml, and only these: the RC tag class, the testpypi
# policy channel, a separate concurrency group and environment, and a
# repository-url on the upload step.

on:
  push:
    # Release-candidate tags only. Stable tags route to release.yml.
    tags:
      - 'v*rc*'
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish to TestPyPI. Leave false for a build-only dry run. A manual
          run still has to satisfy every tag and metadata check in
          tools/release_policy.py; this only says the operator meant it.
        type: boolean
        default: false
        required: true

concurrency:
  group: testpypi-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------
  # 1. Policy. Fail-closed, and first, so a run that may not publish is
  #    rejected before it spends an hour building wheels.
  # ------------------------------------------------------------------------
  policy:
    name: Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Evaluate release policy
        id: decide
        # See the note in release.yml: an expression inside `run:` is spliced
        # into the script before the shell sees it, so a crafted ref name
        # becomes code. These reach the script as environment variables.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_REQUESTED: ${{ inputs.publish || 'false' }}
        run: |
          python tools/release_policy.py \
            --channel testpypi \
            --event-name "$EVENT_NAME" \
            --ref-type "$REF_TYPE" \
            --ref-name "$REF_NAME" \
            --publish-requested "$PUBLISH_REQUESTED" \
            --github-output "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------------
  # 2. Qualification. The same gates as production -- a rehearsal that skipped
  #    them would not be rehearsing the release.
  # ------------------------------------------------------------------------
  qualification:
    name: Complete release qualification
    needs: policy
    uses: ./.github/workflows/qualification.yml

  # ------------------------------------------------------------------------
  # 3. Artifacts. The same reusable workflow production uses.
  # ------------------------------------------------------------------------
  artifacts:
    name: Build and verify release artifacts
    # BOTH: `needs.<job>` resolves only for direct dependencies, and this
    # job reads `needs.policy.outputs.version` below. Declaring only
    # `qualification` made that an empty string, which every
    # `release_artifacts.py inspect` then rejected.
    needs: [policy, qualification]
    uses: ./.github/workflows/release-artifacts.yml
    with:
      expected_version: ${{ needs.policy.outputs.version }}
      source_sha: ${{ github.sha }}

  # ------------------------------------------------------------------------
  # 4. Publish to TestPyPI, via OIDC.
  #
  # TestPyPI trusted-publisher setup (one-time, on test.pypi.org):
  #   Project -> Publishing -> Add a new publisher
  #     Owner: Kuanhao-Chao   Repository: gffbase
  #     Workflow: testpypi-release.yml   Environment: testpypi
  #
  # No GitHub Release is attached here: an RC is a rehearsal, and drafting a
  # release for one would put candidate binaries on the repo's Releases page.
  # ------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    # Same reason: without `policy` here the condition compared '' to
    # 'true' and this job was SKIPPED on every run, tag pushes included.
    needs: [policy, artifacts]
    if: needs.policy.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gffbase
    permissions:
      id-token: write   # OIDC claim -> TestPyPI Trusted Publisher
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # `release-artifacts.yml` uploads the packages as
          # `release-package-*` and the manifest as `release-verification`.
          # Without this pattern the manifest JSON lands in dist/ and is
          # handed to twine as if it were a distribution.
          pattern: release-package-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          verbose: true
          repository-url: https://test.pypi.org/legacy/
