name: TestPyPI release (release-candidate dress rehearsal)

# Mirrors the production release.yml job topology exactly so a green
# run here proves the same build + OIDC publish mechanism will work
# unchanged when we tag the stable v0.1.0. Diffs from production:
#   - Trigger only on v*-rc.* tags (release.yml excludes them).
#   - Different concurrency group + GitHub environment.
#   - publish step adds repository-url to redirect uploads to TestPyPI.

on:
  push:
    tags:
      # Release-candidate tags only — stable tags route to release.yml.
      - 'v*-rc.*'
  workflow_dispatch: {}

# Never race two RC publishes against the same TestPyPI version.
concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------------
  # Linux wheels — manylinux via maturin-action's Docker image.
  # abi3-py39 means a single wheel per arch covers CPython 3.9-3.13.
  # ------------------------------------------------------------------------
  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --manifest-path rust/Cargo.toml
          rust-toolchain: stable
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  # ------------------------------------------------------------------------
  # macOS wheels — both Intel and Apple Silicon.
  # ------------------------------------------------------------------------
  macos:
    name: macOS ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path rust/Cargo.toml
          rust-toolchain: stable
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  # ------------------------------------------------------------------------
  # Windows wheel — single arch (x86_64) for now.
  # ------------------------------------------------------------------------
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --out dist --manifest-path rust/Cargo.toml
          rust-toolchain: stable
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist/*.whl

  # ------------------------------------------------------------------------
  # Source distribution — for archs we don't ship a wheel for.
  # ------------------------------------------------------------------------
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path rust/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ------------------------------------------------------------------------
  # Publish — gathers all artifacts and uploads to TestPyPI via OIDC.
  #
  # TestPyPI trusted-publisher setup (one-time, on test.pypi.org's web UI):
  #   Account → Publishing → Add a new pending publisher
  #     PyPI Project Name:  gffbase
  #     Owner:              Kuanhao-Chao
  #     Repository name:    gffbase
  #     Workflow name:      testpypi-release.yml
  #     Environment name:   testpypi
  # No API token is stored in repo secrets.
  # ------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gffbase
    permissions:
      id-token: write   # OIDC claim → TestPyPI Trusted Publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          verbose: true
