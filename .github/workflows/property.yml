name: Extended property tests

on:
  workflow_dispatch: {}
  schedule:
    # The bounded profile runs in ordinary CI. This deeper deterministic pass
    # is intentionally off the pull-request critical path.
    - cron: "23 5 * * 1"

# See the note in ci.yml: absent this block the job inherits the repository
# default token scope. This workflow only reads the tree.
permissions:
  contents: read

concurrency:
  group: property-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-property:
    name: Extended generated invariants
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@c18ebc01c713fe144ce50311473bf5c1b15b8e08 # 1.83
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> rust/target
      - name: Build candidate and install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run extended generated invariants
        env:
          GFFBASE_HYPOTHESIS_PROFILE: extended
        run: pytest -m property -q

