site_name: GFFBase
# Fail the build on a broken link or a page missing from the nav. Three real
# content files (schema-v2 and both security notes) sat outside the nav and
# were unreachable from the site for an entire release, because the default
# is a warning in a log nobody reads.
strict: true
site_description: Rust + DuckDB GFF3/GTF engine with gffutils compatibility, structural validation, and Arrow-native bulk queries.
site_url: https://khchao.com/gffbase/
repo_url: https://github.com/Kuanhao-Chao/gffbase
repo_name: Kuanhao-Chao/gffbase
edit_uri: edit/main/docs/

# `docs/` is the Markdown source root. Files outside that tree (MIGRATION,
# CHANGELOG, CONTRIBUTING, SECURITY) are pulled in via the include-markdown
# plugin so they live in one place on disk.
docs_dir: docs

theme:
  name: material
  # Only to add the apple-touch-icon and the raster favicon fallback, which
  # Material has no settings for. See `overrides/main.html`.
  custom_dir: overrides
  # The wordmark, in the house style of the author's other tools. Material
  # swaps `logo` for `logo_dark` automatically in dark mode via CSS, so the
  # white twin is referenced from `extra.css` rather than here.
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

# The draft note to the gffutils maintainer is deliberately NOT published: it
# is an unsent private report about a vulnerability in someone else's project.
# `strict: true` would otherwise fail the build over it being outside the nav.
exclude_docs: |
  security/upstream-note-gffutils.md

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [python]
          options:
            # Plain markdown docstrings; suppress strict parameter-section
            # parsing so prose docstrings render as written.
            docstring_style: google
            docstring_section_style: list
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            heading_level: 2
            filters: ["!^_"]   # hide name-mangled internals from rendered docs

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  # Required by Material's `grid cards` blocks on the landing page.
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Kuanhao-Chao/gffbase

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Compatibility & strict modes: guides/modes.md
  - Guides:
      - Analysis gallery: gallery.md
      - Usage Gallery: usage_gallery.md
      - Connections & concurrency: guides/connections.md
      - Command line: cli.md
      - Migration from gffutils: migration.md
  - Cookbooks:
      - cookbooks/index.md
      - GENCODE / Ensembl: cookbooks/gencode_ensembl.md
      - NCBI RefSeq: cookbooks/refseq.md
      - MANE: cookbooks/mane.md
      - Machine Learning Workflows: cookbooks/machine_learning_workflows.md
  - Performance:
      - Benchmarks: performance.md
      - Methodology: performance/methodology.md
      - Datasets: datasets.md
  - API Reference:
      - api/index.md
      - FeatureDB: api/featuredb.md
      - Feature: api/feature.md
      - create_db: api/create_db.md
      - DataIterator & GFFWriter: api/io.md
      - merge_criteria: api/merge_criteria.md
      - Exceptions: api/exceptions.md
      - Multipart features: api/multipart.md
      - validate: api/validate.md
      - migrate: api/migrate.md
      - Compatibility modules: api/compat.md
  - Help:
      - FAQ: faq.md
      - Troubleshooting: guides/troubleshooting.md
  - Design:
      - Architecture: design/architecture.md
      - Schema v2: design/schema-v2.md
  - Project:
      - Testing and release gates: testing.md
      - 0.2 release checklist: release-checklist.md
      - Roadmap: roadmap.md
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Citation: citation.md
      - License: license.md
      - Contact: contact.md
      - Security policy: security-policy.md
      - "Advisory: SQL injection (0.1.0)": security/2026-sql-injection.md
