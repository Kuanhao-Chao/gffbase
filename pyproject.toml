[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "gffbase"
version = "0.1.1"
description = "GFFBase — Rust-accelerated GFF3/GTF parser with a DuckDB-backed storage engine and a drop-in gffutils-compatible Python API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kuan-Hao Chao", email = "kuanhao.chao@gmail.com" },
]
# Bundle the license text in the wheel + sdist so PyPI displays it.
license-files = ["LICENSE"]
keywords = [
    "gff",
    "gff3",
    "gtf",
    "gencode",
    "bioinformatics",
    "genomics",
    "annotation",
    "duckdb",
    "rust",
    "pyo3",
    "parser",
    "feature-database",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Runtime dependencies. DuckDB and PyArrow are required: the storage engine
# is DuckDB and the Rust→Python→DuckDB hand-off goes through PyArrow.
dependencies = [
    # Floors are the oldest versions CI actually tests (see the `minimum-deps`
    # job). Both projects dropped Python 3.9 before these releases, so a single
    # dependency set covers the whole supported 3.10-3.14 range -- no split
    # environment markers are needed.
    "duckdb>=1.4.1",
    "pyarrow>=18.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "hypothesis>=6",
    "pytest-cov>=4",
]
bench = [
    "psutil>=5",
    "memory_profiler>=0.61",  # peak-RSS harness
    "gffutils>=0.13",        # legacy reference for differential correctness
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "hypothesis>=6",
    "psutil>=5",
    "ruff>=0.4",
    "mypy>=1.8",
    "maturin>=1.5,<2.0",
]
# Optional integrations. Each corresponds to a code path that must either work
# when the extra is installed or raise a precise installation error when it is
# not — there are no silent degradations.
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
fasta = ["pyfaidx>=0.7"]
all = [
    "pandas>=1.5",
    "polars>=0.20",
    "pyfaidx>=0.7",
]
docs = [
    # MkDocs site (themed with Material; API ref via mkdocstrings).
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-include-markdown-plugin>=6.2",
    "pymdown-extensions>=10.7",
]

[project.urls]
Homepage      = "https://github.com/Kuanhao-Chao/gffbase"
Source        = "https://github.com/Kuanhao-Chao/gffbase"
Issues        = "https://github.com/Kuanhao-Chao/gffbase/issues"
Documentation = "https://gffbase.khchao.com/"
Changelog     = "https://github.com/Kuanhao-Chao/gffbase/releases"

# ---------------------------------------------------------------------------
# Build backend (maturin) — pip install . must Just Work end-to-end:
# pip downloads maturin per the [build-system] table, maturin invokes cargo,
# cargo builds gffbase._native via PyO3, the wheel is installed alongside
# the python/gffbase/ source tree.
# ---------------------------------------------------------------------------
[tool.maturin]
manifest-path  = "rust/Cargo.toml"
module-name    = "gffbase._native"
python-source  = "python"
features       = ["pyo3/extension-module"]
strip          = true
# Build an abi3 wheel so a single artifact works for CPython 3.10-3.14.
bindings       = "pyo3"
# Maturin's sdist builder uses its own include rules (it does NOT honor
# MANIFEST.in). Bundle the test fixtures + LICENSE so users can rebuild
# from sdist and run the suite.
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "MANIFEST.in", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "rust/Cargo.lock", format = "sdist" },
    { path = "tests/**/*.py", format = "sdist" },
    { path = "tests/data/*", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deliberately NO coverage flags here. Putting `--cov`/`--cov-fail-under` in
# the default addopts made a bare `pytest` hard-require pytest-cov (which the
# `dev` extra did not even install) and made every local run fail on coverage
# rather than on tests. Coverage is a CI gate, applied explicitly:
#
#     pytest --cov=gffbase --cov-report=term-missing --cov-fail-under=<N>
#
# See .github/workflows/ci.yml for the enforced thresholds.
addopts = "-q"
# pytest keeps the last THREE runs of every `tmp_path` directory by default.
# That was harmless when tests built in-memory databases; it is not now. An
# on-disk DuckDB file is pre-allocated at ~6 MB whatever it contains, and
# `test_ingest_atomicity`, `test_migrate` and `test_schema_version_gate` each
# build several per test — so a day's iteration filled /tmp completely and left
# the machine unable to run anything at all, this suite included.
#
# Keeping only the directories of FAILED tests preserves the entire debugging
# value of the retention (a passing test's scratch directory is never looked
# at) while making the footprint proportional to failures rather than to runs.
tmp_path_retention_policy = "failed"
filterwarnings = [
    "ignore::DeprecationWarning:duckdb.*",
]
markers = [
    "native: requires the compiled gffbase._native extension",
    "rtree: requires the DuckDB spatial extension (R-tree index path)",
    "slow: long-running; excluded from the default PR run",
    "parity: differential comparison against an installed gffutils oracle",
    "corpus: needs a downloaded multi-GB annotation corpus",
]

[tool.coverage.run]
branch = true
source = ["gffbase"]
omit = [
    # Pure-Python correctness oracle — its job is to mirror the Rust parser
    # exactly, and the Rust path is the production path. Most of its lines
    # are exercised indirectly via differential tests, but full branch
    # coverage there is redundant work.
    #
    # NOTE: this omit is scheduled for removal in 0.2.0. The fallback parser
    # is the oracle the Rust engine is diffed against and is the *only*
    # parser on a wheel-less install, so it needs real coverage, not an
    # exemption. The `_bins.py` entry that used to sit here was dead — its
    # comment described sqlite_export.py, and `_bins.py` is a 43-line module
    # that the suite already covers.
    "*/_pyfallback/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    # Defensive fallbacks that depend on the host environment — the
    # Rust extension may not be built; an optional package may not be
    # installed; a temp-file cleanup may race with the OS. These are
    # exercised in CI by varying the env (with/without maturin develop;
    # with/without polars/pyfaidx) but a single coverage pass will
    # only ever cover one branch. Excluding keeps the gate honest.
    "except ImportError",
    "except OSError",
    "except duckdb\\.Error",
    "_rust = None",
    "_NATIVE = False",
]
skip_covered = false
show_missing = true
precision = 1

[tool.mypy]
python_version = "3.10"
files = ["python/gffbase"]
mypy_path = "python"
namespace_packages = true
explicit_package_bases = true
# Start honest rather than aspirational: these are the checks the code passes
# today and that CI enforces. The strictness dial is turned up per-module as
# annotations land, rather than being declared globally and then silenced with
# a wall of per-error ignores.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# The compiled extension has no stubs; `native_available()` guards every use.
module = ["gffbase._native"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional integrations, imported lazily inside try/except ImportError.
# `pybedtools` and `Bio` are installed in some environments but ship no
# `py.typed`, so they need the same treatment as the ones that may be absent.
module = [
    "polars.*",
    "pandas.*",
    "pyfaidx.*",
    "duckdb.*",
    "pyarrow.*",
    "pybedtools.*",
    "Bio.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The benchmark and bench scripts are standalone entry points meant to be run
# straight out of a checkout (`python benchmarks/01_ingest.py`). They must
# `sys.path.insert()` the in-tree `python/` directory before importing gffbase,
# so module-level imports genuinely cannot all sit at the top of the file.
"bench/*.py" = ["E402"]
"benchmarks/*.py" = ["E402"]

[tool.ruff.format]
# Match the existing house style: double quotes, spaces, trailing commas on
# multi-line collections. `ruff format --check` is a CI gate from 0.1.1 on.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
