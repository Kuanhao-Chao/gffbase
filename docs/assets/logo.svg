<?xml version="1.0" encoding="UTF-8"?>
<!--
  gffbase wordmark.

  House style, matching OpenSpliceAI / Splam / LiftOn: the logo IS the
  wordmark, and one letter is replaced by a pictogram of what the tool does,
  drawn on the same cap-height grid and at the same weight so the name still
  reads at a glance.

  Here the `b` of "base" keeps its stem while its bowl becomes a DATABASE
  CYLINDER, which is the storage engine the name already refers to. A gene
  model (two exon blocks on an intron line) runs underneath as a second tier,
  the same vocabulary Splam uses, because a GFF3/GTF file is the thing being
  stored. The gap between the exons sits directly under the cylinder.

  Flat 100% black on transparent, no gradients or shadows, per the family.
  `logo-white.svg` is the inverse, for dark backgrounds.

  Geometry, MEASURED from the outlines rather than asserted:

    ascender top  y=30     baseline   y=258     x-height  150
    x-line        y=108    descender  y=322     em       ~318

  An earlier version of this comment claimed the baseline was y=240. It was
  not, and the error propagated. The `g` descender was judged against that
  wrong line, declared twice the normal depth, and compressed to 22 units
  below the true baseline (0.07 em, about a third of normal), which is why it
  read as stunted. It is now 64 units, 0.20 em, where a grotesque `g` sits.

  `a`, `s` and `e` were each drawn too tall (175, 169 and 158 against an
  x-height of 150), so they hung 25, 19 and 8 units below the line while
  `f`, `f` and the `b` stem sat on it. They are scaled about the x-line to
  land at y=260: the baseline plus two units of optical overshoot, which
  round letters should have and flat-bottomed ones should not.

  Gene model occupies y 300..340 and now STARTS at x=250, clear of the `g`
  (which reaches x=219 inside that band). The exon yields to the letter,
  rather than the letter being squashed to fit around it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 365" role="img"
     aria-label="gffbase">
  <title>gffbase</title>
  <g fill="#000000">
    <!-- g : bowl + descender -->
    <path d="M150 108c-46 0-80 32-80 76 0 43 33 74 78 74 20 0 36-6 47-18v13 c0 23-19 36-50 36-22 0-40-5-54-14l-24 27c21 13 48 20 79 20 57 0 92-24 92-66V112h-46v16c-12-13-26-20-42-20zm9 41 c26 0 44 16 44 37s-18 37-44 37-44-16-44-37 18-37 44-37z"/>

    <!-- f -->
    <path d="M300 112h-32v39h32v107h48V151h44v-39h-44V98c0-17 10-26 28-26
             7 0 13 1 19 3l10-38c-11-4-24-6-36-6-42 0-63 24-63 65v18z"/>

    <!-- f -->
    <path d="M424 112h-32v39h32v107h48V151h44v-39h-44V98c0-17 10-26 28-26
             7 0 13 1 19 3l10-38c-11-4-24-6-36-6-42 0-63 24-63 65v18z"/>

    <!-- b as a database: the stem is the letter, the bowl is a cylinder.
         A top disc plus a band is the universal database glyph, and it sits
         in the b's bowl silhouette so the word still reads. -->
    <rect x="560" y="30" width="46" height="228" rx="5"/>
    <!-- cylinder walls + bottom cap. Sized to fill the bowl a `b` would have,
         so the glyph still reads as a letter at 36px. -->
    <path d="M606 132c0-19 36-33 82-33s82 14 82 33v94c0 19-36 33-82 33
             s-82-14-82-33v-94zm30 12v82c0 10 23 17 52 17s52-7 52-17v-82
             c0-10-23-17-52-17s-52 7-52 17z"/>
    <!-- top disc -->
    <ellipse cx="688" cy="142" rx="52" ry="16"/>
    <!-- band -->
    <path d="M636 179c0 10 23 17 52 17s52-7 52-17v16c0 10-23 17-52 17
             s-52-7-52-17v-16z"/>

    <!-- a -->
    <path d="M882 108c-27 0 -50 7.8 -66 20l21 26.9c12 -8.7 26 -13 41 -13 22 0 35 8.7 35 22.6v5.2h-42c-44 0 -70 17.4 -70 45.2 0 26.9 24 45.2 61 45.2 23 0 41 -6.9 52 -18.2v14.8h46V158.4c0 -33.9 -30 -50.4 -78 -50.4zm31 91.2v8.7c0 14.8 -16 24.3 -36 24.3 -17 0 -28 -6.9 -28 -17.4 0 -10.4 10 -15.6 29 -15.6h35z"/>

    <!-- s -->
    <path d="M1050 108c-42 0 -70 18.9 -70 46.8 0 50.4 83 37.8 83 58.5 0 8.1 -9 12.6 -24 12.6 -18 0 -36 -6.3 -49 -16.2l-19 29.7c18 12.6 43 20.7 68 20.7 44 0 73 -18.9 73 -47.7 0 -51.3 -84 -38.7 -84 -59.4 0 -7.2 8 -11.7 22 -11.7 15 0 31 4.5 43 11.7l19 -29.7c-18 -9.9 -40 -15.3 -62 -15.3z"/>

    <!-- e -->
    <path d="M1200 108c-47 0 -81 31.7 -81 76s34 76 84 76c27 0 49 -8.7 65 -23.1l-25 -26.9c-10 9.6 -23 14.4 -37 14.4 -21 0 -36 -10.6 -42 -28.9h116c1 -3.8 1 -8.7 1 -12.5 0 -44.3 -33 -75 -81 -75zm-36 62.5c4 -18.3 18 -28.9 37 -28.9s32 10.6 36 28.9h-73z"/>
  </g>

  <!-- Gene model: two exons on an intron line. Splam's vocabulary, reused
       deliberately, because this is the thing being stored. -->
  <g fill="#000000">
    <rect x="250" y="315" width="1000" height="10" rx="5"/>
    <rect x="310" y="300" width="250" height="40" rx="4"/>
    <rect x="800" y="300" width="390" height="40" rx="4"/>
  </g>
</svg>
